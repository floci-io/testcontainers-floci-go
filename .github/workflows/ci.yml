name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  # release-please builds versions and changelogs from Conventional Commits, so every commit must follow them.
  commit-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          failOnErrors: ${{ github.event_name == 'pull_request' }}

  lint:
    name: Build & vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

  test:
    name: Tests (Go ${{ matrix.go-version }} / tc ${{ matrix.tc-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.25", "stable"]
        # v0.42.0+ only: the moby/moby migration in v0.42.0 breaks compilation against older releases
        tc-version: ["v0.42.0", "v0.43.0", "v0.44.0"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Pin testcontainers-go
        run: |
          go get github.com/testcontainers/testcontainers-go@${{ matrix.tc-version }}
          go mod tidy

      - name: Pull Floci image
        run: docker pull floci/floci:latest

      - name: Run tests
        run: go test -v -timeout 10m ./...
