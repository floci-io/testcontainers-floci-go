name: Semantic Release

# Runs semantic-release on every push to main that touches the module. It analyses the
# Conventional Commits since the last vX.Y.Z tag, decides the bump (none for docs/chore/ci),
# updates CHANGELOG.md, commits it, and pushes the new tag. That tag's GitHub release
# triggers publish.yml, which checks the version resolves on the Go module proxy.
#
# The module is on v1. semantic-release bumps from the latest v-tag, so a breaking change
# (feat! / BREAKING CHANGE) would cut v2.0.0, and Go requires a v2 release to change the
# module path to github.com/floci-io/testcontainers-floci-go/v2 first. Keep changes
# backward compatible (feat: / fix:) until that move is planned.
#
# Required secrets: GH_TOKEN (PAT with contents: write)

on:
  push:
    branches:
      - main
    paths:
      - '*.go'
      - 'go.mod'
      - '.releaserc.json'
      - '.github/workflows/semver.yml'

permissions:
  contents: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Run semantic-release
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/changelog
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
